[project]
name = "mios"
version = "0.1.0"
description = "Market Intelligence & Operations System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.141.1",
    "nats-py>=2.15.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "redis>=8.0.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn>=0.52.0",
]

[project.scripts]
mios = "mios.__main__:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "D", "ANN", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "ANN"]
# Alembic's env.py runs as a script against a module-level `context` proxy.
"migrations/env.py" = ["ERA001"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]
mypy_path = "src"
explicit_package_bases = true
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
# Alembic exposes `context` and `op` as runtime proxies without full stubs.
module = "migrations.env"
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # starlette's TestClient still ships the httpx 0.x integration.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
