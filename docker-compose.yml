name: mios

services:
  api:
    build:
      context: .
      target: runtime
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      HOST: 0.0.0.0
      PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-mios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mios}
      POSTGRES_DB: ${POSTGRES_DB:-mios}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NATS_SERVERS: nats://nats:4222
      # Options Intelligence engine. Connects once a Fyers session exists
      # (browser login at /api/v1/fyers/login); waits otherwise. Set
      # FYERS_USE_SIMULATOR=true for deterministic simulated data instead.
      OPTIONS_ENGINE_ENABLED: ${OPTIONS_ENGINE_ENABLED:-false}
      FYERS_USE_SIMULATOR: ${FYERS_USE_SIMULATOR:-false}
      FYERS_CLIENT_ID: ${FYERS_CLIENT_ID:-}
      FYERS_SECRET_KEY: ${FYERS_SECRET_KEY:-}
      FYERS_REDIRECT_URI: ${FYERS_REDIRECT_URI:-}
      ENGINE_POLL_INTERVAL_SECONDS: ${ENGINE_POLL_INTERVAL_SECONDS:-15}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Persist the Fyers OAuth session so a restart reconnects without a new
      # login. Contains a secret token; backed by a named volume, not the image.
      - fyers_session:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen(
          'http://127.0.0.1:8000/api/v1/health').status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - mios

  frontend:
    # Static React build served by nginx, which proxies /api to the api service.
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - mios

  postgres:
    # TimescaleDB on PostgreSQL 17, per docs/00-technology-stack.md.
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mios}
      POSTGRES_DB: ${POSTGRES_DB:-mios}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mios} -d ${POSTGRES_DB:-mios}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - mios

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - mios

  nats:
    image: nats:2-alpine
    # JetStream must be enabled explicitly; it is off by default.
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - mios

volumes:
  postgres_data:
  redis_data:
  nats_data:
  fyers_session:

networks:
  mios:
    name: mios
    driver: bridge
